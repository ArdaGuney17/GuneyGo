<!DOCTYPE html>
<html lang="tr">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <meta name="theme-color" content="#59CDD1">
  <link rel="manifest" href="/site.webmanifest">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İletişime Geçin | Artun Sağlık Danışmanlığı</title>
  <link rel="stylesheet" href="../css/tailwind.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      width: 100%;
      overflow-x: hidden;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      font-family: 'Poppins', sans-serif;
    }
    .dropdown .dropdown-menu {
      /* The `hidden` Tailwind class will handle hiding/showing */
    }
    .glassmorphism {
      background-color: rgb(31 41 55 / 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgb(75 85 99 / 0.5);
    }
    /* Kaydırma animasyonları */
    .animate-on-scroll {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.2s ease-out, transform 1.2s ease-out;
      will-change: opacity, transform;
    }
    .animate-on-scroll.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    .animate-on-scroll-left {
      opacity: 0;
      transform: translateX(-50px);
      transition: opacity 1.2s ease-out, transform 1.2s ease-out;
      will-change: opacity, transform;
    }
    .animate-on-scroll-right {
      opacity: 0;
      transform: translateX(50px);
      transition: opacity 1.2s ease-out, transform 1.2s ease-out;
      will-change: opacity, transform;
    }
    .animate-on-scroll-left.is-visible,
    .animate-on-scroll-right.is-visible {
      opacity: 1;
      transform: translateX(0);
    }
  </style>

  <!-- Google tag (gtag.js) -->
  
  

  <script src="../components/head.js"></script>
</head>

      <h2 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-8 leading-tight animate-on-scroll">
        Siz bir <span class="text-[#59CDD1]">Hasta</span>, <span class="text-[#59CDD1]">Medikal Turizm Acentesi</span> veya <span class="text-[#59CDD1]">Şirket</span> misiniz?
      </h2>
      <p class="text-lg text-gray-700 leading-relaxed mb-12 max-w-2xl mx-auto animate-on-scroll">
        Size özel bilgi ve hizmetler için lütfen sizi en iyi tanımlayan seçeneği belirleyin.
      </p>
      <div class="flex flex-col md:flex-row justify-center items-center space-y-6 md:space-y-0 md:space-x-8">
        <a href="hastalar-için-iletişim" class="flex flex-col items-center justify-center bg-[#59CDD1] text-white px-8 py-6 rounded-lg shadow-lg hover:bg-[#45a8b3] transition duration-300 w-full md:w-auto min-h-[150px] animate-on-scroll-left">
          <i class="fas fa-user-injured text-5xl mb-4"></i>
          <span class="text-xl font-semibold">Hastalar İçin</span>
        </a>
        <a href="acenteler-için-iletişim" class="flex flex-col items-center justify-center bg-[#59CDD1] text-white px-8 py-6 rounded-lg shadow-lg hover:bg-[#45a8b3] transition duration-300 w-full md:w-auto min-h-[150px] animate-on-scroll">
          <i class="fas fa-plane-departure text-5xl mb-4"></i>
          <span class="text-xl font-semibold">Medikal Turizm Acenteleri İçin</span>
        </a>
        <a href="şirketler-için-iletişim" class="flex flex-col items-center justify-center bg-[#59CDD1] text-white px-8 py-6 rounded-lg shadow-lg hover:bg-[#45a8b3] transition duration-300 w-full md:w-auto min-h-[150px] animate-on-scroll-right">
          <i class="fas fa-building text-5xl mb-4"></i>
          <span class="text-xl font-semibold">Şirketler İçin</span>
        </a>
      </div>
    </div>
  </section>
</main>
