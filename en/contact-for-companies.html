<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <meta name="theme-color" content="#59CDD1">
  <link rel="manifest" href="/site.webmanifest">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Artun Healthcare Consultancy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
    .glassmorphism {
      background-color: rgb(31 41 55 / 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgb(75 85 99 / 0.5);
    }
  </style>

  <!-- Google tag (gtag.js) -->
  
  

  <link rel="stylesheet" href="../css/style.css">
  <script src="../components/head.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="navbar-root"></div>






<main class="pt-16">
  <section id="contact" class="section py-16 bg-white">
    <div class="section-container container mx-auto px-4 max-w-5xl">
      <h2 class="section-title text-3xl font-bold text-center text-gray-900 mb-4">Get In Touch</h2>
      <p class="text-lg text-gray-700 leading-relaxed text-center mb-12 max-w-2xl mx-auto">
        We're here to help! Whether you have a question, need support, want to discuss a partnership or investment opportunity, feel free to reach out to us.
      </p>

      <div class="grid md:grid-cols-[1.2fr_2fr] gap-12 items-start">
        <div>
          <div class="bg-gray-50 p-8 rounded-lg shadow-lg">
            <h3 class="text-2xl font-semibold text-gray-900 mb-6">Contact Information</h3>
            <div class="space-y-4">
              <div class="contact-method flex items-center space-x-3 text-lg text-gray-700">
                <i class="fas fa-envelope text-[#59CDD1] text-xl"></i>
                <span>artunhcc@gmail.com</span>
              </div>
              <div class="contact-method flex items-center space-x-3 text-lg text-gray-700">
                <i class="fas fa-map-marker-alt text-[#59CDD1] text-xl"></i>
                <span>Istanbul, Turkey</span>
              </div>
            </div>
          </div>
        </div>

        <div class="bg-gray-50 p-8 rounded-lg shadow-lg space-y-8">
          <form id="contactForm" class="contact-form space-y-6" action="https://script.google.com/macros/s/AKfycbyPt8bF4tvPwJoQu7DY335H30-9BuzFeG7xx5Od9VHDuIPrIs0H5AyQYCwFLggaRmok8g/exec" method="POST">
            <h3 class="text-2xl font-semibold text-gray-900 mb-4">Send Us a Message</h3>

            <div class="form-group">
              <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Company Name</label>
              <input type="text" id="name" name="name" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-[#59CDD1] focus:border-[#59CDD1]" placeholder="Enter the name of the company" required>
            </div>
            <div class="form-group">
              <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
              <input type="text" id="phone" name="phone" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-[#59CDD1] focus:border-[#59CDD1]" placeholder="Enter phone number with country code" required>
            </div>
            <div class="form-group">
              <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
              <input type="email" id="email" name="email" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-[#59CDD1] focus:border-[#59CDD1]" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
              <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Your Message</label>
              <textarea id="message" name="message" rows="5" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-[#59CDD1] focus:border-[#59CDD1]" placeholder="How can we help you?" required></textarea>
            </div>

            <div class="form-group flex items-start space-x-2 mt-4">
              <input type="checkbox" id="kvkk_onay" name="kvkk_onay" class="mt-1" required>
              <label for="kvkk_onay" class="text-sm text-gray-600">
                I have read and understood the <a href="aydinlatmametni.html" target="_blank" class="text-[#59CDD1] hover:underline font-medium">Information Notice Regarding the Protection and Processing of Personal Data</a>.
              </label>
            </div>

            <div id="formSubmissionMessage" class="hidden p-4 mt-5 rounded-lg text-center font-bold text-white shadow-md transition-opacity duration-300 opacity-0">
            </div>

            <button type="submit" class="w-full bg-[#59CDD1] text-white px-6 py-3 rounded-md hover:bg-[#45a8b3] transition duration-300 font-semibold shadow-md flex items-center justify-center space-x-2">
              <span>Send Message</span>
              <i class="fas fa-paper-plane"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>



<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Mobile menu toggle
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    mobileMenuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });

    // Mobile services dropdown toggle
    const mobileServicesToggle = document.getElementById('mobile-services-toggle');
    const mobileServicesDropdown = document.getElementById('mobile-services-dropdown');
    mobileServicesToggle.addEventListener('click', () => {
      mobileServicesDropdown.classList.toggle('hidden');
    });

    // Desktop dropdown menu toggle
    const servicesToggle = document.getElementById('services-toggle');
    const servicesMenu = document.getElementById('services-menu');
    servicesToggle.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      servicesMenu.classList.toggle('hidden');
    });

    // Close dropdowns when clicking outside
    document.addEventListener('click', (event) => {
      if (!servicesToggle.contains(event.target) && !servicesMenu.contains(event.target)) {
        servicesMenu.classList.add('hidden');
      }
      if (!mobileMenuBtn.contains(event.target) && !mobileMenu.contains(event.target)) {
        mobileMenu.classList.add('hidden');
      }
    });

    // Contact form submission and message display
    const contactForm = document.getElementById('contactForm');
    const formSubmissionMessage = document.getElementById('formSubmissionMessage');

    if (contactForm && formSubmissionMessage) {
      contactForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        // Check if the kvkk consent box is checked
        const kvkkOnay = document.getElementById('kvkk_onay');
        if (!kvkkOnay.checked) {
          formSubmissionMessage.textContent = 'Please read and accept the Information Notice.';
          formSubmissionMessage.style.backgroundColor = '#f44336';
          formSubmissionMessage.classList.remove('hidden');
          formSubmissionMessage.style.opacity = '1';
          setTimeout(() => {
            formSubmissionMessage.style.opacity = '0';
            formSubmissionMessage.classList.add('hidden');
          }, 7000);
          return; // Stop the function
        }

        formSubmissionMessage.style.opacity = '0';
        formSubmissionMessage.classList.add('hidden');
        formSubmissionMessage.textContent = 'Sending your message...';
        formSubmissionMessage.style.backgroundColor = '#59CDD1';
        formSubmissionMessage.classList.remove('hidden');
        formSubmissionMessage.style.opacity = '1';

        try {
          const formData = new FormData(contactForm);
          const response = await fetch(contactForm.action, {
            method: 'POST',
            body: formData
          });

          const resultText = await response.text();
          const successPattern = /success/i;

          if (response.ok && successPattern.test(resultText)) {
            formSubmissionMessage.textContent = 'Success! Your message has been sent.';
            formSubmissionMessage.style.backgroundColor = '#4CAF50';
            contactForm.reset();
          } else {
            formSubmissionMessage.textContent = 'Error: ' + (resultText || 'An unknown error occurred.');
            formSubmissionMessage.style.backgroundColor = '#f44336';
          }
        } catch (error) {
          console.error('Network or submission error:', error);
          formSubmissionMessage.textContent = 'Network error. Please try again.';
          formSubmissionMessage.style.backgroundColor = '#f44336';
        } finally {
          formSubmissionMessage.classList.remove('hidden');
          formSubmissionMessage.style.opacity = '1';
          setTimeout(() => {
            formSubmissionMessage.style.opacity = '0';
            formSubmissionMessage.classList.add('hidden');
          }, 7000);
        }
      });
    }
  });
</script>

<script src="../components/navbar.js"></script>
<script src="../components/footer.js"></script>

    renderNavbar('en');
