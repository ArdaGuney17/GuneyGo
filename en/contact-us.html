<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <meta name="theme-color" content="#59CDD1">
  <link rel="manifest" href="/site.webmanifest">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Artun Healthcare Consultancy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      width: 100%;
      overflow-x: hidden;
    }
    body {
      font-family: 'Poppins', sans-serif;
    }
    /* Removed the conflicting .dropdown-menu CSS rule */
    .mobile-menu {
      flex-direction: column;
      position: absolute;
      top: 64px;
      left: 0;
      width: 100%;
      background-color: white;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 20;
      padding: 1rem;
      border-radius: 0.5rem;
    }
    .glassmorphism {
      background-color: rgb(31 41 55 / 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgb(75 85 99 / 0.5);
    }
    /* Kaydırma animasyonları */
    .animate-on-scroll {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.2s ease-out, transform 1.2s ease-out;
      will-change: opacity, transform;
    }
    .animate-on-scroll.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    .full-screen-section {
      min-height: calc(100vh - 80px); /* Adjust based on header height */
    }
  </style>

  <!-- Google tag (gtag.js) -->
  
  

  <script src="../components/head.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="navbar-root"></div>






<main class="pt-16">
  <section id="choice-section" class="section py-16 bg-white flex items-center justify-center full-screen-section">
    <div class="section-container container mx-auto px-4 max-w-4xl text-center animate-on-scroll">
      <h2 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-8 leading-tight">
        Are you a <span class="text-[#59CDD1]">Patient</span>, a <span class="text-[#59CDD1]">Medical Tourism Agency</span> or a <span class="text-[#59CDD1]">Company</span>?
      </h2>
      <p class="text-lg text-gray-700 leading-relaxed mb-12 max-w-2xl mx-auto">
        Please select the option that best describes you to get tailored information and services.
      </p>

      <div class="flex flex-col md:flex-row justify-center items-center space-y-6 md:space-y-0 md:space-x-8">
        <a href="contact-for-patients" class="flex flex-col items-center justify-center bg-[#59CDD1] text-white px-8 py-6 rounded-lg shadow-lg hover:bg-[#45a8b3] transition duration-300 w-full md:w-auto min-h-[150px]">
          <i class="fas fa-user-injured text-5xl mb-4"></i>
          <span class="text-xl font-semibold">For Patients</span>
        </a>

        <a href="contact-for-agencies" class="flex flex-col items-center justify-center bg-[#59CDD1] text-white px-8 py-6 rounded-lg shadow-lg hover:bg-[#45a8b3] transition duration-300 w-full md:w-auto min-h-[150px]">
          <i class="fas fa-plane-departure text-5xl mb-4"></i>
          <span class="text-xl font-semibold">For Medical Tourism Agencies</span>
        </a>

        <a href="contact-for-companies" class="flex flex-col items-center justify-center bg-[#59CDD1] text-white px-8 py-6 rounded-lg shadow-lg hover:bg-[#45a8b3] transition duration-300 w-full md:w-auto min-h-[150px]">
          <i class="fas fa-building text-5xl mb-4"></i>
          <span class="text-xl font-semibold">For Companies</span>
        </a>
      </div>
    </div>
  </section>
</main>



<!-- Menu toggle + scroll-animation logic live in js/shared.js (rendered on every page). Do not duplicate here. -->

<div id="footer-root"></div>
<script src="../components/navbar.js"></script>
<script src="../components/footer.js"></script>
<script src="../js/shared.js"></script>
<script>
    renderNavbar('en', 'contact');
    renderFooter('en');
</script>
</body>
</html>
