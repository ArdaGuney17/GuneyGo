<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <meta name="theme-color" content="#59CDD1">
  <link rel="manifest" href="/site.webmanifest">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Artun Healthcare Consultancy</title>
  <link rel="stylesheet" href="../css/tailwind.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
    .glassmorphism {
      background-color: rgb(31 41 55 / 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgb(75 85 99 / 0.5);
    }
  </style>

  <!-- Google tag (gtag.js) -->
  
  

  <script src="../components/head.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="navbar-root"></div>






<main class="pt-16">
  <section id="contact" class="section bg-gradient-to-r from-[#59CDD1] to-[#45a8b3] min-h-[calc(100svh-64px)] flex items-center py-8">
    <div class="section-container container mx-auto px-4 max-w-5xl">
      <div class="grid md:grid-cols-[1fr_1.6fr] rounded-2xl shadow-2xl overflow-hidden max-w-4xl mx-auto ring-1 ring-white/20">
        <div class="bg-white/90 backdrop-blur-xl text-gray-900 p-5 flex flex-col justify-between">
          <div>
            <h2 class="text-xl font-bold mb-1">Get In Touch</h2>
            <p class="text-xs text-gray-600 leading-relaxed mb-4">
              We're here to help! Whether you have a question, need support, want to discuss a partnership or investment opportunity, feel free to reach out to us.
            </p>
            <h3 class="text-base font-semibold mb-3">Contact Information</h3>
            <div class="space-y-3">
              <div class="flex items-center gap-3 text-sm">
                <span class="flex items-center justify-center w-8 h-8 rounded-full bg-[#59CDD1]/15 text-[#2b7d82] shrink-0"><i class="fas fa-envelope"></i></span>
                <span>info@artunhealthcare.com</span>
              </div>
              <div class="flex items-center gap-3 text-sm">
                <span class="flex items-center justify-center w-8 h-8 rounded-full bg-[#59CDD1]/15 text-[#2b7d82] shrink-0"><i class="fas fa-map-marker-alt"></i></span>
                <span>Istanbul, Turkey</span>
              </div>
            </div>
          </div>
          <p class="text-xs text-gray-500 mt-6 flex items-center gap-2"><i class="fas fa-shield-alt text-[#59CDD1]"></i> We usually respond within 24 hours.</p>
        </div>

        <div class="bg-white/10 backdrop-blur-sm border-l border-white/20 text-white p-5">
          <form id="contactForm" class="contact-form space-y-2" action="https://script.google.com/macros/s/AKfycbyPt8bF4tvPwJoQu7DY335H30-9BuzFeG7xx5Od9VHDuIPrIs0H5AyQYCwFLggaRmok8g/exec" method="POST">
            <h3 class="text-lg font-semibold text-white mb-2">Send Us a Message</h3>

            <div class="grid sm:grid-cols-2 gap-2">
              <div class="form-group">
                <label for="name" class="block text-sm font-medium text-white/90 mb-1">Company Name</label>
                <input type="text" id="name" name="name" class="w-full px-4 py-1.5 border border-white/30 bg-white/15 text-white placeholder-white/60 rounded-md focus:ring-2 focus:ring-white focus:border-white/60" placeholder="Company name" required>
              </div>
              <div class="form-group">
                <label for="phone" class="block text-sm font-medium text-white/90 mb-1">Phone Number</label>
                <input type="text" id="phone" name="phone" class="w-full px-4 py-1.5 border border-white/30 bg-white/15 text-white placeholder-white/60 rounded-md focus:ring-2 focus:ring-white focus:border-white/60" placeholder="+90 555 123 4567" required>
              </div>
            </div>
            <div class="form-group">
              <label for="email" class="block text-sm font-medium text-white/90 mb-1">Email Address</label>
              <input type="email" id="email" name="email" class="w-full px-4 py-1.5 border border-white/30 bg-white/15 text-white placeholder-white/60 rounded-md focus:ring-2 focus:ring-white focus:border-white/60" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
              <label for="message" class="block text-sm font-medium text-white/90 mb-1">Your Message</label>
              <textarea id="message" name="message" rows="2" class="w-full px-4 py-1.5 border border-white/30 bg-white/15 text-white placeholder-white/60 rounded-md focus:ring-2 focus:ring-white focus:border-white/60" placeholder="How can we help you?" required></textarea>
            </div>

            <div class="form-group flex items-start space-x-2 mt-2">
              <input type="checkbox" id="kvkk_onay" name="kvkk_onay" class="mt-1 accent-white" required>
              <label for="kvkk_onay" class="text-sm text-white/90">
                I have read and understood the <a href="aydinlatmametni" target="_blank" class="text-white underline hover:text-white/80 font-medium">Information Notice Regarding the Protection and Processing of Personal Data</a>.
              </label>
            </div>

            <div id="formSubmissionMessage" class="hidden p-4 mt-5 rounded-lg text-center font-bold text-white shadow-md transition-opacity duration-300 opacity-0">
            </div>

            <button type="submit" class="w-full bg-white text-[#2b7d82] px-6 py-2 rounded-md hover:bg-white/90 transition duration-300 font-semibold shadow-md flex items-center justify-center space-x-2">
              <span>Send Message</span>
              <i class="fas fa-paper-plane"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>



<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Menu toggle logic lives in js/shared.js — do not duplicate it here.

    // Contact form submission and message display
    const contactForm = document.getElementById('contactForm');
    const formSubmissionMessage = document.getElementById('formSubmissionMessage');

    if (contactForm && formSubmissionMessage) {
      contactForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        // Check if the kvkk consent box is checked
        const kvkkOnay = document.getElementById('kvkk_onay');
        if (!kvkkOnay.checked) {
          formSubmissionMessage.textContent = 'Please read and accept the Information Notice.';
          formSubmissionMessage.style.backgroundColor = '#f44336';
          formSubmissionMessage.classList.remove('hidden');
          formSubmissionMessage.style.opacity = '1';
          setTimeout(() => {
            formSubmissionMessage.style.opacity = '0';
            formSubmissionMessage.classList.add('hidden');
          }, 7000);
          return; // Stop the function
        }

        formSubmissionMessage.style.opacity = '0';
        formSubmissionMessage.classList.add('hidden');
        formSubmissionMessage.textContent = 'Sending your message...';
        formSubmissionMessage.style.backgroundColor = '#59CDD1';
        formSubmissionMessage.classList.remove('hidden');
        formSubmissionMessage.style.opacity = '1';

        try {
          const formData = new FormData(contactForm);
          const response = await fetch(contactForm.action, {
            method: 'POST',
            body: formData
          });

          const resultText = await response.text();
          const successPattern = /success/i;

          if (response.ok && successPattern.test(resultText)) {
            formSubmissionMessage.textContent = 'Success! Your message has been sent.';
            formSubmissionMessage.style.backgroundColor = '#4CAF50';
            contactForm.reset();
          } else {
            formSubmissionMessage.textContent = 'Error: ' + (resultText || 'An unknown error occurred.');
            formSubmissionMessage.style.backgroundColor = '#f44336';
          }
        } catch (error) {
          console.error('Network or submission error:', error);
          formSubmissionMessage.textContent = 'Network error. Please try again.';
          formSubmissionMessage.style.backgroundColor = '#f44336';
        } finally {
          formSubmissionMessage.classList.remove('hidden');
          formSubmissionMessage.style.opacity = '1';
          setTimeout(() => {
            formSubmissionMessage.style.opacity = '0';
            formSubmissionMessage.classList.add('hidden');
          }, 7000);
        }
      });
    }
  });
</script>

<div id="footer-root"></div>
<script src="../components/navbar.js"></script>
<script src="../components/footer.js"></script>
<script src="../js/shared.js"></script>
<script>
    renderNavbar('en', 'contactForCompanies');
    renderFooter('en');
</script>
</body>
</html>
