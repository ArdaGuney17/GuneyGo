<!DOCTYPE html>
<html lang="tr">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <meta name="theme-color" content="#59CDD1">
  <link rel="manifest" href="/site.webmanifest">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bize Ulaşın | Artun Sağlık Danışmanlığı</title>
  <link rel="stylesheet" href="../css/tailwind.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.10.1/build/css/intlTelInput.css">
  <style>
    html, body {
      width: 100%;
      overflow-x: hidden;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      font-family: 'Poppins', sans-serif;
    }
    .dropdown .dropdown-menu {
      /* The `hidden` Tailwind class will handle hiding/showing */
    }
    .glassmorphism {
      background-color: rgb(31 41 55 / 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgb(75 85 99 / 0.5);
    }
    /* --- intl-tel-input custom styles (contact form) --- */
    .iti { width: 100%; }
    .iti input.iti__tel-input {
      padding: 0.375rem 1rem;
      border-radius: 0.375rem;
      background-color: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      caret-color: #fff;
      font-size: 1rem;
      width: 100% !important;
      margin-left: 0;
    }
    .iti__tel-input::placeholder { color: rgba(255, 255, 255, 0.6); }
    .iti__tel-input:focus {
      outline: none;
      box-shadow: 0 0 0 2px #fff;
      border-color: rgba(255, 255, 255, 0.6);
    }
    .iti__country-list input[type="text"] {
      color: #000 !important;
      background-color: #fff !important;
      padding: 8px !important;
      margin: 0 !important;
      box-shadow: none !important;
      border: none !important;
      width: 100% !important;
      height: auto !important;
      line-height: normal !important;
    }
    .iti__country-list .iti__search-input {
      background-color: #fff !important;
      border: 1px solid #ccc !important;
      border-radius: 4px !important;
      margin: 8px !important;
      padding: 0 !important;
      width: calc(100% - 16px) !important;
    }
    .iti__country-list input::placeholder { color: #555 !important; opacity: 1 !important; }
    .iti__country-list {
      z-index: 60 !important;
      background-color: rgb(31 41 55 / 0.95);
      color: #fff;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      max-height: 200px !important;
      overflow-y: auto !important;
    }
    .iti__selected-flag { background-color: transparent !important; }
    .iti__highlight { background-color: #59CDD1; }
    .iti__country { padding-top: 8px; padding-bottom: 8px; }
    .iti.error .iti__tel-input {
      border-color: #f44336 !important;
      box-shadow: 0 0 0 2px #f44336 !important;
    }
    .hero-section {
      background-image: url('../img/bosphorus.png');
      background-size: cover;
      background-position: center;
    }
    .hero-overlay {
      background-color: rgba(0, 0, 0, 0.5);
    }
    .pulse-animation {
      animation: pulse-border 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-border {
      0%, 100% { border-color: rgba(255, 255, 255, 0.2); }
      50% { border-color: rgba(255, 255, 255, 0.7); }
    }
    .animate-on-scroll {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      will-change: opacity, transform;
    }
    .animate-on-scroll.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    .animate-on-scroll-left {
      opacity: 0;
      transform: translateX(-50px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      will-change: opacity, transform;
    }
    .animate-on-scroll-right {
      opacity: 0;
      transform: translateX(50px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      will-change: opacity, transform;
    }
    .animate-on-scroll-left.is-visible,
    .animate-on-scroll-right.is-visible {
      opacity: 1;
      transform: translateX(0);
    }
    .hero-animate-up {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      will-change: opacity, transform;
    }
    .hero-animate-up.hero-animate-show {
      opacity: 1;
      transform: translateY(0);
    }
    /* Hide the default file input button */
    .file-input-wrapper input[type="file"] {
      display: none;
    }
  </style>

  <!-- Google tag (gtag.js) -->
  
  

  <script src="../components/head.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="navbar-root"></div>






<main class="pt-16">
  <section id="contact" class="section bg-gradient-to-r from-[#59CDD1] to-[#45a8b3] min-h-[calc(100svh-64px)] flex items-center py-8">
    <div class="section-container container mx-auto px-4 max-w-5xl">
      <div class="grid md:grid-cols-[1fr_1.6fr] rounded-2xl shadow-2xl overflow-hidden max-w-4xl mx-auto ring-1 ring-white/20">
        <div class="bg-white/90 backdrop-blur-xl text-gray-900 p-5">
          <div>
            <h2 class="text-xl font-bold mb-1">İletişime Geçin</h2>
            <p class="text-xs text-gray-600 leading-relaxed mb-4">
              Yardım etmek için buradayız! Bir sorunuz varsa, desteğe ihtiyacınız varsa veya bir sağlık kuruluşu ile görüşmek isterseniz, bize ulaşmaktan çekinmeyin.
            </p>
            <h3 class="text-base font-semibold mb-3">İletişim Bilgileri</h3>
            <div class="space-y-3">
              <div class="flex items-center gap-3 text-sm">
                <span class="flex items-center justify-center w-8 h-8 rounded-full bg-[#59CDD1]/15 text-[#59CDD1] shrink-0"><i class="fas fa-envelope"></i></span>
                <span>info@artunhealthcare.com</span>
              </div>
              <div class="flex items-center gap-3 text-sm">
                <span class="flex items-center justify-center w-8 h-8 rounded-full bg-[#59CDD1]/15 text-[#59CDD1] shrink-0"><i class="fas fa-map-marker-alt"></i></span>
                <span>İstanbul, Türkiye</span>
              </div>
            </div>
          </div>
        </div>

        <div class="bg-white/10 backdrop-blur-sm border-l border-white/20 text-white p-5">
          <form id="contactForm" class="contact-form space-y-2" action="https://script.google.com/macros/s/AKfycbyPt8bF4tvPwJoQu7DY335H30-9BuzFeG7xx5Od9VHDuIPrIs0H5AyQYCwFLggaRmok8g/exec" method="POST">
            <h3 class="text-lg font-semibold text-white mb-2">Bize Bir Mesaj Gönderin</h3>

            <div class="grid sm:grid-cols-2 gap-2">
              <div class="form-group">
                <label for="name" class="block text-sm font-medium text-white/90 mb-1">Şirketin Adı</label>
                <input type="text" id="name" name="name" class="w-full px-4 py-1.5 border border-white/30 bg-white/15 text-white placeholder-white/60 rounded-md focus:ring-2 focus:ring-white focus:border-white/60" placeholder="Şirket adı" required>
              </div>
              <div class="form-group">
                <label for="phone" class="block text-sm font-medium text-white/90 mb-1">Telefon Numarası</label>
                <input type="tel" id="phone" name="phone_number" required>
                <input type="hidden" id="full_phone_number" name="phone">
                <p id="phone-error-msg" class="text-red-200 text-xs mt-1" style="display: none;"></p>
              </div>
            </div>
            <div class="form-group">
              <label for="email" class="block text-sm font-medium text-white/90 mb-1">E-posta Adresi</label>
              <input type="email" id="email" name="email" class="w-full px-4 py-1.5 border border-white/30 bg-white/15 text-white placeholder-white/60 rounded-md focus:ring-2 focus:ring-white focus:border-white/60" placeholder="ornek@eposta.com" required>
            </div>
            <div class="form-group">
              <label for="message" class="block text-sm font-medium text-white/90 mb-1">Mesajınız</label>
              <textarea id="message" name="message" rows="2" class="w-full px-4 py-1.5 border border-white/30 bg-white/15 text-white placeholder-white/60 rounded-md focus:ring-2 focus:ring-white focus:border-white/60" placeholder="Size nasıl yardımcı olabiliriz?" required></textarea>
            </div>

            <div class="form-group flex items-start space-x-2 mt-2">
              <input type="checkbox" id="kvkk_onay" name="kvkk_onay" class="mt-1 accent-white" required>
              <label for="kvkk_onay" class="text-sm text-white/90">
                <a href="aydinlatmametni_tr" target="_blank" class="text-white underline hover:text-white/80 font-medium">Kişisel Verilerin Korunması ve İşlenmesi Hakkında Aydınlatma Metni</a>'ni okudum ve anladım.
              </label>
            </div>

            <div id="formSubmissionMessage" class="hidden p-4 mt-5 rounded-lg text-center font-bold text-white shadow-md transition-opacity duration-300 opacity-0">
            </div>

            <button type="submit" class="w-full bg-white text-[#59CDD1] px-6 py-2 rounded-md hover:bg-white/90 transition duration-300 font-semibold shadow-md flex items-center justify-center space-x-2">
              <span>Mesaj Gönder</span>
              <i class="fas fa-paper-plane"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>



<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.10.1/build/js/intlTelInput.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.10.1/build/js/utils.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Menu toggle logic lives in js/shared.js — do not duplicate it here.

    // === intl-tel-input Initialization ===
    let phoneInputInstance = null;
    const phoneInputField = document.querySelector("#phone");
    const phoneErrorMsg = document.querySelector("#phone-error-msg");
    if (phoneInputField) {
      phoneInputInstance = window.intlTelInput(phoneInputField, {
        initialCountry: "auto",
        geoIpLookup: function (callback) {
          fetch("https://ipapi.co/json")
            .then(res => res.json())
            .then(data => callback(data.country_code || "tr"))
            .catch(() => callback("tr"));
        },
        utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@25.10.1/build/js/utils.js",
        separateDialCode: true,
      });

      const resetPhoneValidation = () => {
        const wrapper = phoneInputField.closest('.iti');
        if (wrapper) wrapper.classList.remove('error');
        if (phoneErrorMsg) {
          phoneErrorMsg.style.display = 'none';
          phoneErrorMsg.textContent = '';
        }
      };
      phoneInputField.addEventListener('change', resetPhoneValidation);
      phoneInputField.addEventListener('keyup', resetPhoneValidation);
    }
    // ==========================================

    // --- Form submission and message display logic ---

    const contactForm = document.getElementById('contactForm');
    const formSubmissionMessage = document.getElementById('formSubmissionMessage');

    if (contactForm && formSubmissionMessage) {
      contactForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        const countryData = phoneInputInstance ? phoneInputInstance.getSelectedCountryData() : null;
        const fullNumber = (countryData && phoneInputField.value.trim()) ? `+${countryData.dialCode}${phoneInputField.value.trim()}` : '';

        formSubmissionMessage.style.opacity = '0';
        formSubmissionMessage.classList.add('hidden');

        formSubmissionMessage.textContent = 'Mesajınız gönderiliyor...';
        formSubmissionMessage.style.backgroundColor = '#59CDD1';
        formSubmissionMessage.classList.remove('hidden');
        formSubmissionMessage.style.opacity = '1';

        try {
          const formData = new FormData(contactForm);
          formData.set('phone', fullNumber);

          const response = await fetch(contactForm.action, {
            method: 'POST',
            body: formData
          });

          const resultText = await response.text();
          const successPattern = /success/i;

          if (response.ok && successPattern.test(resultText)) {
            formSubmissionMessage.textContent = 'Başarılı! Mesajınız gönderildi.';
            formSubmissionMessage.style.backgroundColor = '#4CAF50';
            contactForm.reset();
            if (phoneInputInstance) {
              phoneInputInstance.setNumber("");
              phoneInputInstance.setCountry("tr");
            }
          } else {
            formSubmissionMessage.textContent = 'Hata: ' + (resultText || 'Bilinmeyen bir hata oluştu.');
            formSubmissionMessage.style.backgroundColor = '#f44336';
          }
        } catch (error) {
          console.error('Ağ veya gönderim hatası:', error);
          formSubmissionMessage.textContent = 'Ağ hatası. Lütfen tekrar deneyin.';
          formSubmissionMessage.style.backgroundColor = '#f44336';
        } finally {
          formSubmissionMessage.classList.remove('hidden');
          formSubmissionMessage.style.opacity = '1';

          setTimeout(() => {
            formSubmissionMessage.style.opacity = '0';
            formSubmissionMessage.classList.add('hidden');
          }, 7000);
        }
      });
    }
  });
</script>

<script src="../components/navbar.js"></script>
<script src="../components/footer.js"></script>
